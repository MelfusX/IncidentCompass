name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore IncidentCompass.slnx --locked-mode

      - name: Build
        run: dotnet build IncidentCompass.slnx --configuration Release --no-restore

      - name: Format
        run: dotnet format IncidentCompass.slnx --verify-no-changes --verbosity minimal

      - name: Code organization gate
        shell: pwsh
        run: ./scripts/code-organization-gate.ps1

      - name: Vulnerability scan
        shell: pwsh
        run: ./scripts/package-vulnerability-gate.ps1

      - name: Test
        env:
          INCIDENTCOMPASS_REQUIRE_DOCKER_TESTS: "true"
        run: dotnet test IncidentCompass.slnx --configuration Release --no-build
